<section class="unlock-list">
  <h2 class="pip-title">Par produit</h2>

  <table mat-table [dataSource]="rows()" [trackBy]="trackById">
    <ng-container matColumnDef="produit">
      <th mat-header-cell *matHeaderCellDef>produit</th>
      <td mat-cell *matCellDef="let row">{{ row.product.name }}</td>
    </ng-container>

    <!-- Tout débloqué : le message occupe visuellement le reste de la ligne (autres cellules
         vides). -->
    <ng-container matColumnDef="palier">
      <th mat-header-cell *matHeaderCellDef>prochain palier</th>
      <td mat-cell *matCellDef="let row" class="palier">
        <!-- Icône du palier avec repli (D32) devant son nom ; aucune icône quand tout est débloqué. -->
        @if (row.next; as next) {
          <app-game-icon [candidates]="icons(next)" />
          {{ next.name }}
        } @else {
          tous les paliers débloqués
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="effet">
      <th mat-header-cell *matHeaderCellDef>effet</th>
      <td mat-cell *matCellDef="let row">
        @if (row.next; as next) { {{ next.typeratio }} ×{{ next.ratio }} }
      </td>
    </ng-container>

    <ng-container matColumnDef="progression">
      <th mat-header-cell *matHeaderCellDef>progression</th>
      <td mat-cell *matCellDef="let row">
        @if (row.next; as next) {
          <div class="progression">
            <mat-progress-bar
              mode="determinate"
              [value]="row.progress"
              aria-label="Progression vers le prochain palier"
            />
            <span class="muted">{{ row.product.quantite }} / {{ next.seuil }}</span>
          </div>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" [class.unlocked]="row.next === null"></tr>
  </table>
</section>
