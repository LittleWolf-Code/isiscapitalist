<mat-card class="product" appearance="outlined">
  <div class="product-layout">
    <!-- Partie gauche (F-07) : image du produit, quantité superposée en bas ; un clic lance la
         production (F-10). Grisée sans exemplaire ; un produit automatisé ne se clique plus. -->
    <div class="product-visual" [class.empty]="product().quantite === 0">
      <button
        type="button"
        class="icon-button"
        [disabled]="!canProduce()"
        [attr.aria-label]="'Produire ' + product().name"
        (click)="startFabrication()"
      >
        <app-game-icon class="icon" [candidates]="[product().logo]" [alt]="product().name" [pixelIcons]="pixelIcons()" />
      </button>
      <span class="quantite" aria-label="Exemplaires possédés">{{ product().quantite }}</span>
    </div>

    <!-- Partie droite : nom, barre de production avec le gain, achat + temps restant. -->
    <div class="product-right">
      <div class="product-title-row">
        <mat-card-title>{{ product().name }}</mat-card-title>
        @if (product().managerUnlocked) {
          <mat-chip-set class="manager" aria-label="Production automatisée">
            <mat-chip>manager</mat-chip>
          </mat-chip-set>
        }
      </div>

      <div class="product-gain">
        <mat-progress-bar mode="determinate" [value]="progress()" aria-label="Production en cours" />
        <span class="bar-label" [innerHTML]="gain() | bigvalue"></span>
      </div>

      <div class="product-buy">
        <!-- Quantité achetée et coût (F-07, F-14) ; désactivé si le joueur ne peut pas payer. -->
        <button matButton="filled" class="buy" type="button" [disabled]="!canBuy()" (click)="buy.emit(numberToBuy())">
          x{{ numberToBuy() }} — <span [innerHTML]="cost() | bigvalue"></span>
        </button>
        <span class="product-timer" role="timer" aria-label="Temps restant">{{ remaining() | second }}</span>
      </div>
    </div>
  </div>
</mat-card>
