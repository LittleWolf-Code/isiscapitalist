<section class="palier-list">
  @if (visible().length === 0) {
    <p class="empty">{{ emptyText() }}</p>
  } @else {
    <table mat-table [dataSource]="visible()" [trackBy]="trackByName">
      <!-- Icône du palier avec repli sur le produit ciblé / le monde (D32) ; en-tête vide. -->
      <ng-container matColumnDef="logo">
        <th mat-header-cell *matHeaderCellDef class="logo-cell"></th>
        <td mat-cell *matCellDef="let palier" class="logo-cell">
          <app-game-icon class="round" [candidates]="icons(palier)" [pixelIcons]="pixelIcons()" />
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>nom</th>
        <td mat-cell *matCellDef="let palier" class="name">{{ palier.name }}</td>
      </ng-container>

      <!-- Cible en toutes lettres : nom du produit / Global / Anges (D32). -->
      <ng-container matColumnDef="produit">
        <th mat-header-cell *matHeaderCellDef>produit</th>
        <td mat-cell *matCellDef="let palier">{{ target(palier) }}</td>
      </ng-container>

      <ng-container matColumnDef="effet">
        <th mat-header-cell *matHeaderCellDef>effet</th>
        <td mat-cell *matCellDef="let palier">{{ bonus(palier) }}</td>
      </ng-container>

      <ng-container matColumnDef="seuil">
        <th mat-header-cell *matHeaderCellDef>{{ costUnit() ? 'coût' : 'seuil' }}</th>
        <td mat-cell *matCellDef="let palier" class="seuil">
          @if (costUnit()) {
            <span [innerHTML]="palier.seuil | bigvalue"></span> {{ costUnit() }}
          } @else {
            {{ palier.seuil }} exemplaires de chaque produit
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let palier">
          <!-- Actif seulement si le solde suffit (F-18 : « sélectionnable » si l'argent suffit). -->
          <button matButton="filled" type="button" [disabled]="!canAfford(palier)" (click)="action.emit(palier)">
            {{ actionLabel() }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let palier; columns: displayedColumns()" [class.affordable]="!actionLabel() || canAfford(palier)"></tr>
    </table>
  }
</section>
