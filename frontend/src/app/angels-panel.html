<section class="angels-panel">
  <dl class="stats">
    <dt>Anges actifs</dt>
    <dd>{{ activeangels() }}</dd>
    <dt>Total des anges</dt>
    <dd>{{ totalangels() }}</dd>
    <dt>Bonus par ange</dt>
    <dd>{{ angelbonus() }} %</dd>
    <dt>Score</dt>
    <dd [innerHTML]="score() | bigvalue"></dd>
  </dl>

  <!-- Anges à réclamer par un reset, sur le bouton lui-même (fig. 11 « To Claim with Restart »). -->
  <button matButton="filled" type="button" class="reset warn" (click)="resetRequested.emit()">
    <span class="earned">{{ angelsEarned() }} anges</span>
    <span class="claim">à réclamer avec un reset</span>
  </button>
</section>
