<!-- Aucun <img> sans candidat valide (ou en attente du rendu Pip-Boy) : jamais l'icône « image
     cassée » du navigateur. .pixel : agrandissement net de la data URL 96 × 96 (D35). -->
@if (displaySrc(); as src) {
  <img [src]="src" [alt]="alt()" [class.pixel]="pixelIcons()" (error)="onError()" />
}
