<!-- Écran de l'onglet actif (projeté par App), puis la barre : [tabPanel] est obligatoire pour
     mat-tab-nav-bar (rôle tab / tabpanel), et fait poser mdc-tab--active + aria-selected sur le
     lien actif. -->
<mat-tab-nav-panel #screen class="screen">
  <ng-content />
</mat-tab-nav-panel>

<!-- Stretch Material (défaut) + flex-basis: 0 dans le .css : les 6 onglets se partagent toute la
     largeur à parts égales (D26). -->
<nav mat-tab-nav-bar class="bar" [tabPanel]="screen" aria-label="Écrans">
  @for (item of items; track item.id) {
    <a
      mat-tab-link
      class="tab"
      [active]="active() === item.id"
      [attr.data-tab]="item.id"
      (click)="onClick(item.id)"
    >
      <span
        class="tab-label"
        [matBadge]="badge(item.id)"
        [matBadgeHidden]="badge(item.id) === 0"
        matBadgePosition="above after"
        matBadgeDescription="éléments achetables"
      >{{ item.label }}</span>
    </a>
  }
</nav>
