# Champs d'un Palier, partagés par getWorld (5 listes) et les mutations qui retournent un Palier.
fragment PalierFields on Palier {
  name
  logo
  seuil
  idcible
  ratio
  typeratio
  unlocked
}

# Monde complet : chargé au démarrage, au changement de pseudo, sur Refresh et après un reset ;
# entre deux chargements le client le fait évoluer lui-même (D36).
query GetWorld($user: String!) {
  getWorld(user: $user) {
    name
    logo
    money
    score
    totalangels
    activeangels
    angelbonus
    lastupdate
    products {
      id
      name
      logo
      cout
      croissance
      revenu
      vitesse
      quantite
      timeleft
      managerUnlocked
      paliers {
        ...PalierFields
      }
    }
    allunlocks {
      ...PalierFields
    }
    upgrades {
      ...PalierFields
    }
    angelupgrades {
      ...PalierFields
    }
    managers {
      ...PalierFields
    }
  }
}

# Diviseur de la formule des anges du compte (D43), lu à part (D49) : un serveur au schéma du
# sujet ne connaît pas `angeldivisor` et refuserait GetWorld tout entier s'il en faisait partie.
# Requête facultative : en erreur, le client garde la formule du sujet (10¹⁵).
query GetAngelDivisor($user: String!) {
  getWorld(user: $user) {
    angeldivisor
  }
}
