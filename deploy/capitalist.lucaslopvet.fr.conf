# Site Nginx d'ISIS Capitalist (D39), installé par deploy/remote-install.sh dans
# /etc/nginx/sites-available/. Le frontend Angular compilé est servi en statique ; /graphql et
# /icones/ sont relayés au backend (service systemd isiscapitalist, 127.0.0.1:3200), si bien que
# le frontend parle à sa propre origine (frontend/src/app/server.ts).
# Certificat Let's Encrypt obtenu par `certbot certonly --nginx` (renouvelé par certbot.timer).

server {
    listen 80;
    listen [::]:80;
    server_name capitalist.lucaslopvet.fr;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name capitalist.lucaslopvet.fr;

    ssl_certificate /etc/letsencrypt/live/capitalist.lucaslopvet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capitalist.lucaslopvet.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/isiscapitalist/frontend;
    index index.html;

    location = /graphql {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /icones/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        expires 1d;
    }

    # Fichiers du build Angular, au nom haché (outputHashing: all) : cache long.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jamais mis en cache, pour qu'un redéploiement soit vu tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
